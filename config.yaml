genome_fasta: data/CEN6_ver_220406_part.fasta
output_dir: output_no_reduction
custom_library: data/pisum_custom_library.fasta
tandem_repeat_library: data/FabTR_all_sequences_210901.db.RM_format.fasta
# possible values are: rush, default, quick,
# if missing, default is used
repeatmasker_sensitivity: default
# rmblastn -culling_limit for the RepeatMasker step. 0 = off (default, behaviour
# unchanged). Caps redundant HSPs per genomic locus, which on a redundant de-novo
# library (each TE copy otherwise hits hundreds of near-identical consensi) makes
# RepeatMasker much faster. Measured through the real wrapper path on a Pisum-type
# genome: 2 -> ~3x faster at -0.7% masked bp (classification preserved); with
# repeatmasker_sensitivity: rush, ~7x at -1.8%. 2 is the recommended value; 1 is
# more aggressive (dropped ~3% masked bp in testing). Test on your data first.
repeatmasker_culling_limit: 0
# Same rmblastn culling for the TideCluster reannotation step (independent knob,
# 0 = off). Tandem arrays are the strongest culling target (a dimer matches the
# array at every phase -> many overlapping HSPs). Measured on tiny_pea: ~8x
# faster tc_reannotate at -0.8% masked bp. CAUTION: may under-mask LARGE
# satellite arrays (megasatellites) - validate masked bp on a big-satellite
# genome before enabling.
tidecluster_reannotate_culling_limit: 0
# possible values are: True, False, if missing, True is used
reduce_library: False
# Rotation-invariant reduction of the TideCluster consensus dimer library used
# by the genome-wide tandem remasking (tidecluster_reannotate). Independent of
# reduce_library above. Default True: lossless for masking (validated) and makes
# the remasking ~1.5-5x faster by collapsing redundant phase variants per TRC.
# Set False to remask with the full (unreduced) dimer library.
reduce_tidecluster_library: True
# Second-round CONTAINMENT reduction of the RepeatMasker library (independent of
# reduce_library). After the per-class CAP3/mmseqs reduction, this drops short
# repeat fragments that are fully contained in a longer element of the SAME
# class; RepeatMasker masks their genomic copies via the container, so masking
# and classification are preserved. Validated masked-bp-lossless on the Pisum
# pangenome (~-22% library bp, ~-30% RepeatMasker wall-time). Default True; set
# False to feed RepeatMasker the full per-class-reduced library.
reduce_library_containment: True
# Thresholds for the containment pass above: a fragment is removed only if a
# longer same-class sequence covers at least containment_min_coverage of its
# length at >= containment_min_identity percent identity. 80 / 0.90 is the
# validated lossless default; raise for a more conservative reduction.
containment_min_identity: 80
containment_min_coverage: 0.90
# DANTE_TIR_FALLBACK tuning (both default to 3 if omitted).
# dante_tir_fallback_min_alignments: how many other anchors must support an
#   extension length before it is applied (larger = more conservative extensions).
# dante_tir_fallback_min_cluster_size: minimum mmseqs cluster size whose
#   representative is kept in the fallback repeat library (larger = higher
#   multiplicity requirement for library entries).
dante_tir_fallback_min_alignments: 3
dante_tir_fallback_min_cluster_size: 3
# dante_tir_fallback_max_group_size / dante_line_max_group_size (default 1000):
#   OOM guard for the O(N^2) all-vs-all flank alignment. When a TIR subtype
#   (fallback) or the LINE pattern set has MORE anchors than this, they are
#   split into deterministic, mmseqs-clustering-based groups of at most this
#   size and aligned per group. At/below the threshold the result is
#   byte-identical to no grouping. Must be >= 2.
dante_tir_fallback_max_group_size: 1000
# The fallback shares dante_line's flank-extension engine and shows the same
#   failure: on a wheat run 85% of fallback bp comes from inferred flanks rather
#   than the TPase anchor, and 13-35% of anchor groups have fewer than 5
#   alignments (so a fixed "3rd largest" filters nothing). Same support rule.
#   Its length bound is per TIR superfamily, from max_consensus_length in
#   classification_vocabulary.yaml - CACTA reaches ~20 kb, Tc1_Mariner cannot.
dante_tir_fallback_support_fraction: 0.5
dante_tir_fallback_min_group_alignments: 5
dante_line_max_group_size: 1000
# DANTE_LINE consensus-boundary guards. dante_line infers where a LINE ends from
#   an all-vs-all alignment of its flanks; in a repeat-dense genome the flank is
#   often another, far more abundant repeat, so the extension runs to the 10 kb
#   --flank ceiling and the "LINE consensus" becomes mostly foreign sequence that
#   RepeatMasker then masks genome-wide as Class_I/LINE.
# dante_line_support_fraction (default 0.5): fraction of a group's flank
#   alignments that must reach the kept extension. 0 restores the pre-1.7.0
#   fixed "3rd largest", which a 3-member group satisfies by construction.
# dante_line_min_group_alignments (default 5): groups with fewer flank
#   alignments get no extension at all. 0 disables.
# dante_line_max_extension (default 0): symmetric ESCAPE HATCH — a value > 0
#   caps BOTH sides of the LINE flank extension at that many bp, and is a
#   COMPLETE manual override (it disables the per-side bounds, the span bound
#   AND the convergence gate, so it is never quietly tightened by a vocabulary
#   value). At 0 the bounds come from three Class_I/LINE tables in
#   classification_vocabulary.yaml. Two are MEASURED on 218 confirmed loci
#   across 7 genomes: max_extension_per_side = 3400 bp 5' / 2500 bp 3', and
#   max_core_to_3prime_end = 4500 bp on (domain core + 3' extension) — the
#   distance from the START of the core to the element's 3' end, applied after
#   the per-side caps, LINE only. The 3' per-side value is a backstop that never
#   binds in practice (observed max 2338 bp); the span is the real 3' bound,
#   because the 3' extension is only the remainder after the core annotation
#   stops (r = -0.936 with core length). The third,
#   unconverged_max_extension_per_side (2000 bp 5' / 800 bp 3', LINE only), is
#   used INSTEAD of those allowances when the flank alignment never found a
#   boundary: an extension within its allowance CONVERGED and is kept in full,
#   one that exceeds it ran to the edge of the search window and falls back to
#   the conservative value (never looser than the allowance itself). On
#   GCA_973357735.1, 63% of 550 LINE elements never converged 5' and the gate
#   keeps the median element at 6,033 bp instead of 7,429 bp; where the
#   inference does converge the gate changes nothing.
#   dante_tir_fallback has no config key for this and reads its measured
#   per-superfamily bounds from max_extension_per_side.
# dante_line_max_element_length (default 8000): whole-element cap in bp. The
#   domain core is never trimmed, only the appended flanks. 0 disables.
# screen_library_cross_class (default True): trim cross-class contamination out
#   of the RepeatMasker library. Every other reduction CARP runs is WITHIN a
#   class, so a consensus that is part LINE and part LTR is invisible to all of
#   them. cross_class_max_shared_depth (1) keeps sibling LTR lineages safe;
#   cross_class_ownership_margin (0.10) decides which side of a shared region is
#   the chimera, so a broken consensus cannot drag a correct one down with it.
screen_library_cross_class: True
cross_class_min_identity: 80
cross_class_min_length: 200
cross_class_max_shared_depth: 1
cross_class_ownership_margin: 0.10
# Which span seeds the RepeatMasker library from the two INFERRED-boundary tools.
#   'core' (default) = only the span DANTE annotated; the inferred flanks stay in
#   the GFF3 but never enter the similarity search. 'element' = previous
#   behaviour. See docs/configuration.md.
dante_line_library_source: core
dante_tir_fallback_library_source: core
dante_line_support_fraction: 0.5
dante_line_min_group_alignments: 5
dante_line_max_extension: 0
dante_line_max_element_length: 8000
# line_confirmed_elements (default true): also write the LINE elements whose BOTH
#   ends were OBSERVED (poly-A tail + target-site duplication) to
#   DANTE_LINE/LINE_confirmed_elements.{fasta,tsv}. EVALUATION OUTPUT ONLY —
#   nothing consumes it, so the annotation is byte-identical either way. ~4 s on
#   a 5.4 Gb genome. See docs/line_boundaries.md.
line_confirmed_elements: true
# max_memory_gb (default 0 = auto-detect): memory available to this run, in GB —
#   the allocation the scheduler granted (qsub -l mem=128gb), not a per-rule
#   figure. Sets the default resources.mem_mb of every memory-gated rule, so one
#   value sizes the make_unified worker pool, the BigWig pools, DANTE_TIR's CAP3
#   assemblies and TideCluster's TideHunter/TAREAN pools. `run_pipeline.py -m 128`
#   sets it from the command line. SET THIS ON A CLUSTER OR IN A CONTAINER:
#   /proc/meminfo reports the whole node, not the job (the kernel does not
#   namespace it), and the cgroup limit usually sits on an ancestor job scope
#   that may be unreachable from inside the .sif — so auto-detection can size
#   every pool against memory the job may not use. See docs/configuration.md.
max_memory_gb: 0
# dante_tir_cap3_max_memory_gb (default 0 = auto): CAP3 memory budget (GB) for
#   DANTE_TIR's concurrent assemblies. 0 lets DANTE_TIR 0.3.0 auto-detect (it
#   reads the cgroup limit, else node RAM, and uses 60%). The dante_tir rule
#   instead derives 60% of resources.mem_mb when a scheduler/profile allocates
#   it — so CAP3 respects the job budget even with no cgroup limit — and uses
#   this knob as the fallback. Set > 0 (GB) to pin it (non-cgroup HPC / huge
#   genomes). See docs/configuration.md.
dante_tir_cap3_max_memory_gb: 0
# make_unified_max_workers (default 8, 0 = no ceiling): hard cap on concurrent
#   mclapply workers in make_unified_annotation. Caps CONCURRENCY ONLY — batch
#   composition comes from threads, so this cannot change the annotation. Each
#   forked worker's peak RSS converges on the PARENT heap (measured on a 94 Gbp
#   genome: 48.3 GB per worker for all 55 batches, vs a 48.4 GB parent), so 96
#   workers demanded ~2.66 TB on a 768 GB host and the rule was OOM-killed; the
#   same work at 4 workers took 885 s. Tier resolution is only ~13% of this
#   rule's wall time, so a low ceiling costs little. A memory gate (cgroup- and
#   resources.mem_mb-aware) applies on top. See docs/configuration.md.
make_unified_max_workers: 8
# DANTE_TIR primary-element library filter. Default 3 matches the
# historical behaviour from before the DANTE_TIR_FALLBACK refactor (when
# the library was sourced from `all_representative_elements_min3.fasta`,
# which `dante_tir_summary.R` builds with `--min_cluster_size 3`). The
# value gates the `Multiplicity` attribute on each primary GFF parent:
# elements with `Multiplicity < threshold` are dropped from the library
# only — they remain visible in DANTE_TIR_combined.gff3 and the unified
# annotation. Lower to 1 to disable the filter.
dante_tir_min_multiplicity: 3

# Optional inclusion of DANTE_TIR_FALLBACK reps in the RepeatMasker
# library. Default false to preserve historical behaviour byte-for-byte.
# When true, build_fallback_tir_library re-clusters the post-overlap
# fallback survivors, applies a Multiplicity floor, and runs a strict
# class-aware blastn filter against the LTR / DANTE_TIR primary / LINE
# / custom libraries. A fallback rep is dropped if any blast hit lands
# on a subject of incompatible classification — a CACTA fallback hit
# on an LTR-Copia or even a sibling hAT primary is dropped, only
# same-path / ancestor / descendant matches are kept. The kept reps
# are appended to combined_library.fasta. Audit log of all decisions
# is written to DANTE_TIR/fallback_library_dropped.tsv.
# The fallback library is intentionally NOT used to filter the LTR
# library (the fallback layer is treated as less reliable than the
# primary layer; a misclassified fallback must not damage the LTR
# annotation).
include_dante_tir_fallback_in_library: false
# Multiplicity floor applied to fallback cluster sizes when the flag
# above is true. Leave null to inherit dante_tir_min_multiplicity (3).
dante_tir_fallback_library_min_multiplicity: null

# ── TideCluster 1.16.0 options ───────────────────────────────────────────────
# rDNA identification: when true, TideCluster flags 45S/5S rDNA TRCs and the
# unified annotation labels them rDNA_45S / rDNA_5S (array-level) instead of a
# generic Satellite TRC. Set false to disable (--no_rdna).
tidecluster_detect_rdna: true
# Optional override for TideCluster's rDNA reference library. Empty = the bundled
# data/rdna_library.fasta (validated on the calibration array). Point at the
# pipeline's own data/rdna_library.fasta if the bundled set under-calls.
tidecluster_rdna_library: ""
# Cross-TRC overlap resolution: when false (default), TideCluster makes the
# clustering GFF3 non-overlapping across satellite TRCs (dominant-TRC-wins). Set
# true to keep the raw overlapping regions (--keep_overlaps).
tidecluster_keep_trc_overlaps: false
# Genome chunk size (bp) for the parallel, pooled RepeatMasker in tc_reannotate
# (the requested speedup). Sequences below 2x this are only packed
# (byte-identical); larger ones split with <0.15% masked-bp drift. Default 50 Mb.
tidecluster_chunk_size: 50000000
# Post-run cleanup of per-tool intermediate scratch, done by run_pipeline.py
# after a SUCCESSFUL run (never on failure/dry-run). minimal (default) deletes
# clearly-unconsumed scratch (staged genome copies, DANTE_TIR.RData, mmseqs
# scratch, DANTE_LTR library TE*.fasta, …); maximal additionally purges the big
# TideCluster tarean/kite trees and tool workdirs; none keeps everything.
# The CLI flag --keep-all forces none. Manifest outputs are never touched.
cleanup_intermediates: minimal
