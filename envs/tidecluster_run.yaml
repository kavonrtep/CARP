# Dedicated env for the TideCluster rules (tidecluster_long, tidecluster_short,
# tidecluster_reannotate). Split out from envs/tidecluster.yaml because
# TideCluster >=1.15 needs r-base >=4.2 (via r-igraph 2.0.3) while DANTE pins
# r-base 4.1.3 — the two cannot coexist in one conda env.
#
# TideCluster 1.16.0 bundles TideHunter, mmseqs2, RepeatMasker (4.1.2.p1 — same
# version as the shared env), rtracklayer and optparse. 1.16.0 adds three
# behaviours the pipeline relies on, all default-on in `run_all`:
#   - rDNA identification: writes rDNA_type=45S|5S into the clustering GFF3
#     (consumed by make_unified_annotation.R -> array-level rDNA_45S/rDNA_5S);
#   - cross-TRC overlap resolution: clustering GFF3 made non-overlapping across
#     satellite TRCs (dominant-TRC-wins);
#   - chunked, pooled tc_reannotate RepeatMasker (replaces the ineffective
#     whole-genome -pa with a custom -lib on RMBlast; Dfam #274) — the
#     requested speedup, with the post-RM filter made sub-quadratic.
# The helper scripts the TideCluster rules call directly are declared explicitly
# so the env is self-documenting and robust to future dependency changes:
#   - calculate_density_batch.R -> bioconductor-rtracklayer, r-optparse
#   - reduce_dimer_library.py    -> mmseqs2
#
# 1.16.2 fixes the TRC-superfamily empty-fallback naming: the no-superfamily
# case now writes the canonical <prefix>_trc_superfamilies.csv (with header)
# instead of an unheadered 0-byte <prefix>_superfamilies.csv. That is the file
# scripts/tc_reannotate_sf_filter.py consumes for superfamily-aware array
# recovery (config tidecluster_reannotate_superfamily_merge).
#
# 1.16.3 fixes the tc_reannotate chunk-pool RepeatMasker library-build race that
# could silently truncate the reannotation on a fresh env's first run: the RM
# libraries are now built once before the pool fans out, and a failed chunk
# makes tc_reannotate exit non-zero instead of merging a partial set. See
# docs/archive/tidecluster_reannotate_chunk_race_request.md.
#
# 1.17.0 makes the HTML report (<prefix>_report/) self-contained: it now vendors
# its per-TRC PNGs into <prefix>_report/img/ instead of referencing them via ../
# inside the TideCluster_kite / TideCluster_tarean working trees. That makes
# `cleanup_intermediates: maximal` (which purges those multi-GB trees) SAFE — the
# report survives the purge with no broken images. Verified end-to-end on the
# small fixture (0/9 report PNG refs missing after a maximal purge). See
# docs/archive/tidecluster_self_contained_report_request.md.
#
# 1.18.0 is a large-genome performance / scalability update, verified
# byte-identical to 1.17.0 on the deterministic outputs (no behaviour, CLI
# or output change): TAREAN/rDNA use a random-access IndexedFasta reader
# instead of loading the whole genome into RAM (was OOMing large assemblies),
# O(1) TideHunter coordinate remap, linear duplicate-array filtering, and a
# memory-gated parallel per-part TideHunter. Purge-safety (self-contained
# report) reconfirmed end-to-end on the small fixture.
#
# 1.19.0 fixes three parallelism collapses measured on a 94 Gbp genome at -c 96,
# all requested by this project (docs/archive/tidecluster_parallelism_request.md).
# Verified byte-identical to 1.18.0 on the deterministic outputs (per change and
# end-to-end on an A. thaliana run_all --long); no behaviour, CLI or output change.
#   * tc_reannotate: each chunk worker now parses its own RepeatMasker .out, remaps
#     to genome coordinates and writes a sorted fragment; the parent streams a
#     k-way merge. The old serial parent pass (re-read every chunk, one
#     Gff3Feature object per hit, accumulate all hits, sort) dominated the stage —
#     measured 2.3 of 96 cores over 43.3 h. Parent memory now scales with chunk
#     count rather than hit count.
#   * TAREAN dispatches longest-first (LPT) instead of in arbitrary order, so a
#     large TRC can no longer start late and strand the pool.
#   * TAREAN gives large TRCs multiple threads. Jobs were always `-n 1`, so one
#     huge TRC ran alone on a single core at the tail: on the 94 Gbp genome 441 of
#     445 jobs finished within ~2 h and TRC_1 then ran ~55 h by itself, 74 % of the
#     stage. Thread count is memory-gated; tarean.R output is thread-independent.
# 1.20.0 fixes the memory budget under batch schedulers and in containers
# (TideCluster issue #6, reported from this project): TideHunter's pool size and
# TAREAN's thread cap were resolved from /proc/meminfo MemAvailable, which the
# kernel does not namespace — inside a .sif that is the NODE's free memory, not
# the job's limit. A 128 GB PBS job read a ~1.6 TB budget, spawned 32 concurrent
# TideHunter parts wanting ~310 GB, and was OOM-killed with no earlier symptom.
# 1.20.0 adds `--max_memory <GB>` (on run_all / tidehunter / tarean) and one
# resolution chain shared by both gates: --max_memory -> AGENT_MEMORY ->
# scheduler environment (PBS_RESC_MEM, SLURM_MEM_PER_NODE, LSB_MAX_MEM_RUSAGE,
# SLURM_MEM_PER_CPU x SLURM_CPUS_ON_NODE) -> cgroup limit -> MemAvailable, with
# the winning source logged and a warning when it falls through to MemAvailable
# under a scheduler. CARP passes the job's allocation explicitly, from config
# max_memory_gb / `run_pipeline.py -m <GB>` via resources.mem_mb, so TideCluster
# never has to guess; scripts/mem_utils.py mirrors the same chain and labels for
# the rest of the pipeline. Behaviour on a plain host with no scheduler,
# container or AGENT_MEMORY is unchanged (MemAvailable x 0.8, as before), and
# where a source does hit the only change is a smaller pool — TideHunter and
# TAREAN output are thread-count-independent. NOTE: tc_reannotate has no
# --max_memory upstream (its RepeatMasker chunk pool is CPU-sized), so the
# tidecluster_reannotate rule passes nothing.
# 1.20.1 fixes two silent-failure bugs, one of which hits a CARP feature
# directly (upstream issue #7, reported from this project):
#   * compare_trc_by_blast.R named each dotplot after every member TRC id joined
#     together, so a superfamily of ~61+ three-digit members blew past NAME_MAX
#     (255 B); png() could not open the device and the script died on the FIRST
#     loop iteration. Superfamilies are ordered by decreasing member count, so
#     the largest is always first and the loss was TOTAL, not partial: the
#     superfamily CSV, the manifest and the closing of the HTML page all went
#     with it, while run_all still exited 0. That CSV is exactly what
#     tidecluster_reannotate_superfamily_merge consumes — so on a genome with one
#     big satellite superfamily the merge silently fell back to the plain
#     per-TRC filter (the failure mode the feature exists to prevent), with only
#     the rule's NOTE line to show for it. Dotplots are now named by rank
#     (superfamily_001.png) and a failed image can no longer discard the CSV.
#   * No run_cmd call site inspected its return status, so a dead step led to a
#     report that denied its own missing results. Steps whose failure invalidates
#     the outputs now abort non-zero; presentational ones warn. NOTE: a run that
#     previously "succeeded" with missing TideCluster results will now fail the
#     rule loudly — which is what we want, but it can surface pre-existing
#     breakage on re-runs.
# 1.20.2 / 1.21.0 / 1.21.1 (all 2026-08-21) close out the cleanup thread this
# project opened as CARP issue #3:
#   * 1.20.2 makes tc_comparative_analysis.R honour the run prefix for ALL six of
#     its per-run inputs. It resolved four from the input table's
#     tidecluster_prefix but hardcoded `tc_` for the two consensus FASTAs, so any
#     run made with a different -pr (CARP uses -pr TideCluster) aborted at
#     readDNAStringSet. Output for the historic all-`tc` case is byte-identical.
#   * 1.21.0 adds `--cleanup` to run_all: a file-level purge inside
#     <prefix>_{kite,tarean,consensus}/ that keeps a run viewable, re-renderable,
#     comparable and usable by tc_per_tra_consensus.py. CARP does NOT pass it —
#     cleanup here stays one post-run step behind cleanup_intermediates, covering
#     DANTE/RepeatMasker/mmseqs scratch in the same pass — but
#     scripts/cleanup_outputs.py::_MAXIMAL is kept character-for-character in step
#     with tc_utils.CLEANUP_PATTERNS so one definition governs both.
#   * 1.21.1 writes <prefix>_consensus/consensus_sequences_all.fasta during
#     CLUSTERING rather than annotation. It used to appear only when run_all got
#     `-l <library>`, so a CARP run without `tandem_repeat_library` produced a
#     directory that looked complete and aborted the comparative analysis on
#     contact. Every CARP run is now comparative-ready, existing ones included
#     (the analysis rebuilds the pool from TRC_*_dimers.fasta when it is absent).
#     The file is concatenated in TRC order, so it does not vary between machines.
# 1.21.2 makes rDNA identification accept CARP's classification vocabulary and
# stop failing silently on a library it cannot read (upstream request from this
# project, docs/archive/tidecluster_rdna_library_naming_request.md). The subunit
# family used to be matched as `class.split("/")[0]` against the two literals
# ("rDNA_45S", "rDNA_5S"), so only TideCluster's own spelling worked: a library
# using an equivalent hierarchical vocabulary -- e.g. CARP's
# `rDNA/45S_rDNA/18S`, the SAME 117 sequences relabelled -- matched nothing and
# produced a header-only <prefix>_rdna.tsv, indistinguishable from a genome with
# no rDNA, at exit 0. Three changes:
#   * `rdna_top_type()` matches the subunit family ANYWHERE in the class path,
#     so rDNA_45S/18S, rDNA/45S_rDNA/18S and 45S_rDNA/18S are all accepted.
#     45S is tested before 5S and both exclude a preceding digit, because the
#     string "45S" contains "5S" (a naive 5S test would label every 45S
#     reference 5S, and "25S" would match too).
#   * `validate_rdna_library()` raises up front (before any BLAST) when NO entry
#     names a subunit family, listing the classes it did find, and warns when
#     only some are unusable. A library contributing zero references is a
#     configuration error, not a genome without rDNA.
#   * the bundled data/rdna_library.fasta is relabelled to CARP's canonical form
#     (rDNA/45S_rDNA/{18S,25S,5.8S}, rDNA/5S_rDNA/5S) -- same 117 sequences,
#     same per-class counts, so the two libraries no longer disagree.
# Output contract is UNCHANGED: <prefix>_rdna.tsv still has columns
# TRC/rDNA_type/coverage with bare "45S"/"5S" labels, which is what
# make_unified_annotation.R::load_rdna_map() reads -- no CARP change needed.
# Setting `tidecluster_rdna_library` to CARP's own data/rdna_library.fasta is
# now safe; before 1.21.2 it silently disabled rDNA detection.
name: tidecluster_run
channels:
  - conda-forge
  - bioconda
  - petrnovak
dependencies:
  - tidecluster=1.21.2
  # CARP-added helper deps, pinned to the validated SIF build (release 1.0.7);
  # the r-* / bioconductor builds here are the r-base 4.3.3 (r43) set this env
  # resolves (TideCluster needs r-base >= 4.2).
  - bioconductor-rtracklayer=1.62.0
  - r-optparse=1.7.5
  - mmseqs2=16.747c6
  - r-jsonlite=2.0.0
  - r-yaml=2.3.10
  - pyyaml=6.0.3
  # jq here is belt-and-suspenders (bioconductor-rtracklayer pulls
  # bioconductor-genomeinfodbdata, whose post-link runs yq -> jq). The
  # AUTHORITATIVE fix is the system-level `apt-get install jq` in the Singularity
  # %post — conda gives no guarantee this env-level jq links before that
  # post-link runs. Keep both.
  - jq=1.8.2
