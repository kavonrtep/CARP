# Shared "main" computational env: DANTE_LTR, the R/report stack, and
# RepeatMasker. Used by ~19 rules (dante_ltr, library construction,
# repeatmasker, and all the R bigwig/summary/report rules).
#
# NOTE: neither TideCluster nor the bare DANTE (`dante`) tool is here.
#   * TideCluster >=1.15 needs r-base >=4.2 (via r-igraph 2.0.3); the TideCluster
#     rules use envs/tidecluster_run.yaml.
#   * DANTE moved to r-base 4.2.3 in 0.2.11, while dante_ltr 0.5.2.0 still pins
#     r-dplyr 1.0.7 (r-base <4.2) — so the two can no longer share an env and
#     DANTE split out to envs/dante.yaml. This env is pinned to r-base 4.1 by
#     dante_ltr.
# The file name is kept for minimal churn even though it no longer ships
# TideCluster or DANTE.
#
# repeatmasker is pinned explicitly: it used to be pulled in transitively via
# the tidecluster package, so removing TideCluster from this env would
# otherwise silently drop RepeatMasker (4.1.2.p1) that the `repeatmasker` and
# `dante_ltr` rules depend on.
name: tidecluster
channels:
  - conda-forge
  - bioconda
  - petrnovak
dependencies:
  # dante_ltr 0.5.2.0 makes its library clustering deterministic (canonically
  # sorts TE_all.fasta before mmseqs easy-cluster), so the Ty1_copia/Angela
  # library no longer churns run-to-run — see
  # docs/archive/dante_ltr_deterministic_clustering_request.md.
  #
  # 0.5.3.0 parallelises the per-chunk detection loop, which was strictly serial:
  # `for i in range(number_of_temp_files): subprocess.check_call(...)` ran one
  # detect_putative_ltr.R at a time, so `dante_ltr -c 96` used 1.0 core for 24.2 h
  # on a 94 Gbp genome (1,889 chunks at `-S 50000000`). The chunks are now run in
  # a pool: largest chunk first as a memory probe, remaining chunks longest-first
  # via imap_unordered, each child at `-c 1`, with the pool size capped by
  # min(cpu, 0.8 * MemAvailable / per-chunk peak RSS) so a big `-c` cannot OOM.
  # Requested by this project — docs/archive/dante_ltr_chunk_parallelism_request.md.
  # Output is unchanged: per-chunk results go to index-keyed files and are
  # concatenated in index order, so completion order cannot reach the output. The
  # change is confined to that loop (plus the `-S` help text); the fd-budget guard
  # from the too-many-open-files fix is retained.
  #
  # 0.5.4.0 fixes the budget that gate reads (upstream issue #13, a request from
  # this project — docs/archive/dante_ltr_max_memory_request.md). `MemAvailable`
  # is not namespaced, so inside a .sif under PBS/Slurm it is the NODE's free
  # memory, not the job's limit; pool_size is linear in it, so a 128 GB job on a
  # node reporting ~1.6 TB oversubscribes 12.5x and the one safeguard between a
  # large `-c` and an OOM stops binding. 0.5.4.0 adds `--max_memory <GB>` and the
  # same chain as TideCluster 1.20.0 / scripts/mem_utils.py: --max_memory ->
  # AGENT_MEMORY -> scheduler env (PBS_RESC_MEM, SLURM_MEM_PER_NODE, ...) ->
  # cgroup (walked leaf -> root, so an ancestor job scope is found) ->
  # MemAvailable, naming the winning source in the pool-sizing line and warning
  # when the budget is host-wide while a scheduler job id is set. The helper
  # returns the RAW budget and the 0.8 headroom stays at the call site, so the
  # factor is applied exactly once. The `dante_ltr` rule passes the job's
  # allocation explicitly (config max_memory_gb -> resources.mem_mb). Output is
  # unchanged — per-chunk results stay index-keyed, so pool size cannot reach it;
  # verified on tiny_pea, 0.5.3.0 vs 0.5.4.0 byte-identical on DANTE_LTR.gff3
  # (26,150 features) and DANTE_LTR_statistics.csv but for the version header.
  #
  # 0.6.x adds the core-domain detection mode and the library annotation policy
  # CARP's `dante_ltr_mode` exposes (docs/dante_ltr_core_mode_plan.md).
  #   0.6.0.0  `--mode core`: seed on the ordered RT/RH/INT triplet, whose ORDER
  #            gives the superfamily without consulting REXdb, instead of
  #            requiring the domains to agree on a REXdb lineage. `lineage`
  #            stays the default and its output is unchanged.
  #   0.6.1.0  `dante_ltr_to_library --annotation_conflict {strict,nested}`
  #            (default strict, byte-identical). Requested by this project —
  #            docs/dante_ltr_core_library_policy_request.md.
  #   0.6.2.0  passes `--spaced-kmer-mode 0` to `mmseqs easy-cluster`, because
  #            linclust otherwise invents a RANDOM spaced-kmer pattern per
  #            process. NOTE: this CHANGES the library content in BOTH modes
  #            (~+1.5% representatives upstream; -0.4% measured on a CARP
  #            library here), so the LTR library and the RepeatMasker annotation
  #            downstream of it move on this bump even at the default
  #            `dante_ltr_mode: lineage`. Expect that diff.
  # Detection itself is untouched: the `dante_ltr` executable is byte-identical
  # 0.6.0.0 -> 0.6.2.0 and `utils/` differs only by the new library_policy.R.
  #   0.6.3.0  crash fixes only: core mode no longer aborts a chunk when a seed's
  #            RT/RH/INT all sit between --min_relative_length_core and the
  #            standard threshold (#14), or when exactly one domain passes the
  #            block filter; dante_ltr_summary no longer fails on single-lineage
  #            or PBS-less output.
  #   0.6.4.0  lineage mode no longer aborts the whole run ("each range must
  #            have an end that is greater or equal to its start minus one",
  #            get_ranges_right()) when an opposite-strand domain overlaps an
  #            element's first/last domain (#15). More likely with `-M 1`,
  #            which the `dante_ltr` rule passes. Only windows that were
  #            invalid change.
  #   Measured 0.6.2.0 vs 0.6.4.0 on tiny_pea: lineage mode byte-identical
  #   (GFF3, statistics, FASTAs, LTR library). Core mode: same 4,444 elements
  #   and coordinates, but 137 gain the seed's core domains (#14) and 1 loses
  #   its lineage label as a result.
  - dante_ltr=0.6.4.0
  - repeatmasker=4.1.2.p1
  - seqkit=2.8.2
  - cap3=10.2011
  # CARP-added helper deps; r-jsonlite/r-yaml are the r-base 4.1 (r41) builds
  # this env resolves (now pinned by dante_ltr, formerly by DANTE).
  - r-jsonlite=1.8.5
  - r-yaml=2.3.7
  - pyyaml=6.0.3
  # jq here is belt-and-suspenders for the bioconductor-*data post-link scripts
  # (installBiocDataPackage.sh -> yq -> jq). The AUTHORITATIVE fix is the
  # system-level `apt-get install jq` in the Singularity %post, because conda
  # gives no ordering guarantee that this env-level jq links before
  # genomeinfodbdata's post-link runs. Keep both.
  - jq=1.8.2
