genome_fasta: data/CEN6_ver_220406_part.fasta
output_dir: output
custom_library: data/pisum_custom_library.fasta
tandem_repeat_library: data/FabTR_all_sequences_210901.db.RM_format.fasta

# RepeatMasker sensitivity. One of: rush, default, quick. Defaults to default.
repeatmasker_sensitivity: default

# rmblastn -culling_limit for the RepeatMasker step. 0 = off (default; behaviour
# unchanged). N>0 caps the number of redundant HSPs kept per genomic locus.
# Rationale: a de-novo repeat library carries many near-identical consensi per
# family, so each genomic TE copy aligns to hundreds of them -> a per-locus HSP
# explosion (~800k HSPs / 3 Mb measured) that dominates rmblastn extension AND
# RepeatMasker's downstream overlap-filter/ProcessRepeats. culling discards an
# HSP whose query range is enveloped by >= N higher-scoring HSPs, collapsing that
# redundancy at search time (the best hit per locus is never culled, so masking
# and classification are preserved). It is, in effect, library reduction applied
# at search time -- useful when the library itself is hard to reduce further.
# Measured through the real repeatmasker_wrapper.py path on a Pisum-type genome:
#   2          -> ~3.0x faster RepeatMasker, -0.7% masked bp
#   2 + rush   -> ~7.5x faster,             -1.8% masked bp
#   1          -> slightly faster still but -3% masked bp (too aggressive)
# Recommended value 2. Injected via an RMBLAST_DIR shim in the wrapper, so no
# RepeatMasker/container patch is needed (works in the existing image). Validate
# on your own genome before making it the default.
repeatmasker_culling_limit: 0

# rmblastn -culling_limit for the TideCluster reannotation step
# (tidecluster_reannotate), independent of repeatmasker_culling_limit above.
# 0 = off (default). This is the strongest culling target in the pipeline: a
# consensus dimer aligns to a satellite array at every rotational phase, so a
# single locus accrues many overlapping HSPs that culling collapses. Measured on
# tiny_pea (same-machine A/B through the real tc_reannotate.py): culling 2 ->
# ~8x faster, -0.8% masked bp, shim confirmed on 1382 searches.
# CAUTION: tc_reannotate already risks under-masking LARGE satellite families
# (RepeatMasker needs the full consensus diversity to tile megasatellite arrays
# contiguously; cf. the reduce_tidecluster_library note). Culling collapses
# overlapping HSPs, which may worsen that on genomes with big satellites - so
# validate masked bp on such a genome before enabling. Same RMBLAST_DIR shim
# mechanism (no RepeatMasker/container patch). Recommended test value 2.
tidecluster_reannotate_culling_limit: 0

# Superfamily-aware array recovery for the RM-on-TideCluster reannotation
# (default True). tc_reannotate keeps an array only where a SINGLE TRC reaches
# the monomer-length threshold; when one real tandem array is tiled by >=2 TRCs
# of the same superfamily (common for short near-identical satellites) each
# per-TRC piece is sub-threshold and the array is lost -> a TE-derived tandem
# array is missed and the underlying TE prevails (culling only masks this by
# collapsing each locus to one TRC, making the result culling-dependent). When
# True the pipeline runs tc_reannotate --debug and re-filters its raw hits
# (scripts/tc_reannotate_sf_filter.py) grouping sibling TRCs by superfamily, so
# real arrays are recovered deterministically (independent of culling) while
# every feature keeps its bare TRC_<n> Name.
tidecluster_reannotate_superfamily_merge: True

# Tandem gate for the unified annotation (default True). A Tier-4 RM-on-
# TideCluster satellite may override a Tier-5 TE call only where it has
# independent tandem evidence (raw TideHunter); an unsupported RM_TC array (a
# short AT-rich consensus tiling a non-tandem TE such as a Tekay LTR-RT) is
# demoted below the TE, preventing spurious TE->satellite over-masking. RM_TC
# over non-TE sequence and genuine satellites are unaffected.
rm_tc_tandem_gate: True

# Library size reduction (mmseqs/cap3 dedup). True or False; default True.
reduce_library: True

# DANTE_TIR_FALLBACK extension stringency (defaults: 3 / 3).
dante_tir_fallback_min_alignments: 3
dante_tir_fallback_min_cluster_size: 3

# All-vs-all flank-alignment OOM guard (default 1000 each). When a TIR subtype
# (fallback) or the LINE pattern set has MORE anchors than this, the O(N^2)
# parasail all-vs-all is split into deterministic, mmseqs-clustering-based
# groups of at most this size and run per group — bounding peak memory on large
# genomes. At/below the threshold the result is byte-identical to no grouping.
# Must be >= 2. See docs/configuration.md.
dante_tir_fallback_max_group_size: 1000

# Boundary guards for the fallback layer — it shares dante_line's flank-extension
# engine and the same failure mode. See docs/configuration.md.
dante_tir_fallback_support_fraction: 0.5
dante_tir_fallback_min_group_alignments: 5
dante_line_max_group_size: 1000

# DANTE_LINE consensus-boundary guards — they stop a LINE consensus being
# extended through the neighbouring high-copy repeat. support_fraction scales the
# support requirement with the size of the group (0 = the old fixed "3rd
# largest"); min_group_alignments drops groups with too few partners to place a
# boundary; the caps bound each side and the whole element in bp, trimming only
# the appended flanks and never the domain core. See docs/configuration.md.
# Cross-class library screen — trims a span that belongs to an incompatible
# class out of a consensus, which no within-class reduction can see. See
# docs/configuration.md.
screen_library_cross_class: True
cross_class_min_identity: 80
cross_class_min_length: 200
cross_class_max_shared_depth: 1
cross_class_ownership_margin: 0.10

# Which span seeds the RepeatMasker library from the two INFERRED-boundary tools.
#   'core' (default) = only the span DANTE annotated; the inferred flanks stay in
#   the GFF3 but never enter the similarity search. 'element' = previous
#   behaviour. See docs/configuration.md.
dante_line_library_source: core
dante_tir_fallback_library_source: core
dante_line_support_fraction: 0.5
dante_line_min_group_alignments: 5
# dante_line_max_extension (default 0): symmetric ESCAPE HATCH — a value > 0 caps
#   BOTH sides of the LINE flank extension at that many bp, and is a COMPLETE
#   manual override: it disables the per-side bounds, the span bound AND the
#   convergence gate below, so what you set is never quietly tightened by a
#   vocabulary value. At 0 the bounds come from three Class_I/LINE tables in
#   classification_vocabulary.yaml (not config keys):
#     max_extension_per_side  = 3400 bp 5', 2500 bp 3' — the allowance for an
#                               extension the flank alignment CONVERGED on.
#     max_core_to_3prime_end  = 4500 bp on (domain core + 3' extension), i.e.
#                               the distance from the START of the domain core
#                               to the element's 3' end; applied after the
#                               per-side caps. LINE only — TIR is deliberately
#                               not covered and stays on per-side bounds.
#     unconverged_max_extension_per_side
#                             = 2000 bp 5', 800 bp 3' — used INSTEAD of the
#                               allowance for a side whose inference never found
#                               a boundary. LINE only, TIR not covered.
#   CONVERGED vs NOT. dante_line infers an element's length by aligning the
#   flanks of many copies. If that alignment stops on its own, inside the search
#   window, the evidence chose a length: a raw extension within its allowance is
#   trusted and kept in full. If the raw extension EXCEEDS the allowance the
#   alignment ran to the window edge — the "length" is just where we stopped
#   looking — so the element falls back to unconverged_max_extension_per_side
#   (the conservative 1.7.0rc1 values). The fallback can never LOOSEN a bound:
#   the clamp takes the tighter of the fallback and the allowance, since a core
#   already past the 4500 bp span has an allowance of 0.
#   MEASURED on GCA_973357735.1 (550 LINE elements): the raw 5' inference has
#   median 7,613 bp against a 10,000 bp window — 63% never converged. Giving
#   those the converged allowance raised total extension 74.7%, moved the median
#   element from 4,960 to 7,429 bp and put 322 of 550 over 7 kb, above the
#   documented 4-7 kb plant LINE range. With the gate: median 6,033 bp, 22 over
#   7 kb. On a genome whose inference does converge the gate changes nothing
#   (byte-identical result).
#   The 3' per-side value is a BACKSTOP only (observed max 3' extension 2338 bp,
#   p99 2180, so it never binds); the span is the real 3' constraint. Reason:
#   the 3' extension is not a biological distance, it is the remainder after
#   DANTE stops annotating the core — over 148 confirmed loci r(core length,
#   3' extension) = -0.936, so the extension alone varies 13.8x (p90/p10) while
#   the span varies only 1.16x (per-genome medians 3779-4247 bp, 7 genomes).
#   MEASURED on 218 LINE loci across 7 genomes with BOTH ends observed (poly-A
#   tail + a TSD clearing the chance floor), discarding saturated 20 bp matches
#   and elements over 7500 bp: 5' p95 3360 -> 3400, span p95 4274 -> 4500 (just
#   under the observed max 4507, so the guard fails toward truncation). These
#   truncate 9 loci (4.1%) 5' and 1 (0.5%) 3'; the earlier flat 2000/800 caps
#   truncated 125 (57.3%) and 157 (72.0%), losing 89,196 and 149,884 bp.
#   Applies to DANTE_LINE only — dante_tir_fallback has no config key and reads
#   its per-superfamily bounds (measured p95) from max_extension_per_side.
dante_line_max_extension: 0
# Whole-element cap in bp (core + both flanks); the core is never trimmed.
dante_line_max_element_length: 8000

# EVALUATION OUTPUT — IT FEEDS NOTHING. With line_confirmed_elements: true
#   (default) the run writes the subset of LINE elements whose BOTH ends were
#   directly OBSERVED rather than inferred from flank alignment — a poly-A tail
#   plus a target-site duplication (TSD), the two marks target-primed reverse
#   transcription leaves behind — to:
#     DANTE_LINE/LINE_confirmed_elements.fasta  (RepeatMasker headers,
#                                                name#Class_I/LINE — usable
#                                                as a library as-is)
#     DANTE_LINE/LINE_confirmed_elements.tsv    (per-element evidence: TSD
#                                                sequence/length/score, poly-A
#                                                length, extensions, element
#                                                length)
#   Nothing consumes them: not the RepeatMasker library, not the unified
#   annotation, not any downstream rule. THE ANNOTATION IS BYTE-IDENTICAL
#   WHETHER THIS IS ON OR OFF. They exist so the idea can be judged across many
#   genomes before anything depends on it.
#   Not enabled as a library source because the benefit is genome-dependent:
#   adding them to the LINE library moved masking +28.2% (Boechera stricta, 25
#   confirmed) and +0.7% (GCA_986270105, 250 confirmed). Clean in both cases
#   (0.7-0.9% contamination vs the cores' own 8.8-11.4%), but the gain tracks
#   how much LINE the core library already misses, not the confirmation rate.
#   RELIABILITY: a confirmed call is right ~97% of the time — the poly-A and TSD
#   tests are statistically independent, so their error rates multiply (measured
#   joint false-positive rate 0.073%, exactly the product of the two).
#   YIELD: only 0.7-5.0% of LINE loci confirm, depending on how recently LINEs
#   were active; ancient, decayed populations (wheat) yield least.
#   COST: negligible — ~4 s on a 5.4 Gb genome with 11,900 LINE loci.
#   See docs/line_boundaries.md for the derivation.
line_confirmed_elements: true

# Memory available to this run, in GB — the scheduler's allocation, not a
# per-rule figure. 0 = auto-detect (AGENT_MEMORY, then the scheduler environment
# PBS_RESC_MEM / SLURM_MEM_PER_NODE / ..., then the cgroup limit, then
# MemAvailable). Sizes every memory-gated pool in the pipeline; the equivalent
# CLI flag is `run_pipeline.py -m 128`. Set it explicitly on a cluster or in a
# container: /proc/meminfo is not namespaced, so it reports the node rather than
# the job, and the job's cgroup limit is often unreachable from inside the .sif.
# The run prints the resolved budget and its source at startup. See docs.
max_memory_gb: 0

# CAP3 memory budget (GB) for DANTE_TIR's concurrent assemblies. 0 = auto:
# DANTE_TIR 0.3.0 reads the cgroup limit (else node RAM) and uses 60%. The
# dante_tir rule instead derives 60% of resources.mem_mb when a profile allocates
# it (so CAP3 respects the job budget even without a cgroup limit); this value is
# the fallback when mem_mb is unset. Set > 0 (GB) to pin it. See docs.
dante_tir_cap3_max_memory_gb: 0
make_unified_max_workers: 8

# Hard ceiling on concurrent workers in the BigWig density rules
# (make_bigwig_density and the two per-family rules). 0 = no ceiling: those
# rules size the pool by MEASURING the heaviest task (it runs first, alone) and
# dividing the memory budget by its peak RSS — the budget being resources.mem_mb
# when a profile sets it, else the tightest of the cgroup limit and MemAvailable.
# Caps concurrency only; every task writes its own .bw, so no track can change.
# Set > 0 to pin the worker count (e.g. no detectable memory budget).
bigwig_max_workers: 0

# DANTE_TIR primary-library Multiplicity floor (default 3).
# Drop primary elements with Multiplicity < threshold from the library.
# They stay in DANTE_TIR_combined.gff3 and the unified annotation.
dante_tir_min_multiplicity: 3

# Optional: promote DANTE_TIR_FALLBACK reps into the RepeatMasker library
# (default false — preserves historical behaviour). When true:
#   * fallback survivors are re-clustered with mmseqs;
#   * cluster reps with size >= dante_tir_fallback_library_min_multiplicity
#     are kept (null inherits dante_tir_min_multiplicity);
#   * a strict class-aware blastn filter (e-value 1e-19) drops any rep
#     whose hits include a default-library subject of incompatible
#     classification — siblings (CACTA vs hAT) count as incompatible,
#     only same-path or ancestor/descendant pairs survive.
# Audit log: DANTE_TIR/fallback_library_dropped.tsv.
# The fallback library is intentionally NOT used to filter the LTR
# library — see CLAUDE.md "DANTE_TIR Fallback Workflow" for rationale.
include_dante_tir_fallback_in_library: false
dante_tir_fallback_library_min_multiplicity: null
