name: unit

on:
  push:
  pull_request:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: carp-unit
          create-args: >-
            python=3.11
            pyyaml
            r-base
            r-yaml
            r-jsonlite
          cache-environment: true
          cache-downloads: true

      - name: Python classification vector
        run: python tests/test_classification.py

      - name: Output manifest contract
        run: python tests/test_manifest.py

      - name: Unified GFF3 output contract (format-drift guard)
        run: python tests/test_unified_gff3_spec.py

      - name: Config parameters + CHANGELOG documented (docs-in-sync gate)
        run: python tests/test_config_docs.py

      - name: Containment library-reduction logic
        run: python tests/test_containment_reduce.py

      - name: DANTE_TIR multiplicity filter GFF3<->FASTA join
        run: python tests/test_filter_dante_tir_multiplicity.py

      - name: All-vs-all alignment grouping (OOM-guard) logic
        run: python tests/test_aln_grouping.py

      - name: Flank-index equivalence (dante_line / dante_tir_fallback)
        run: python tests/test_flank_index.py

      - name: RepeatMasker-wrapper streaming FASTA reader
        run: python tests/test_repeatmasker_wrapper_streaming.py

      - name: Post-run output cleanup (keep-list safety)
        run: python tests/test_cleanup_outputs.py

      - name: Canonical FASTA sort (deterministic clustering inputs)
        run: python tests/test_canonical_sort_fasta.py

      - name: Alignment-engine hardening (atomic writes, length analysis)
        run: python tests/test_alignment_engine_hardening.py

      - name: dante_line pattern order is PYTHONHASHSEED-invariant
        run: python tests/test_dante_line_order.py

      - name: dante_line consensus-boundary guards (masks, caps, support rule)
        run: python tests/test_dante_line_boundaries.py

      - name: Per-superfamily / per-side extension bounds
        run: python tests/test_superfamily_extension_bounds.py

      - name: Cross-class library screen (conflict rule, ownership, trimming)
        run: python tests/test_screen_library_cross_class.py

      - name: Library-health summary (empty-class + boundary flags)
        run: python tests/test_library_health.py

      - name: Determinism-gate comparator (assert_run_determinism)
        run: python tests/test_assert_run_determinism.py

      - name: RepeatMasker-library canonical-order guard (assert_library_canonical_order)
        run: python tests/test_assert_library_canonical_order.py

      - name: Memory-budget resolver (scheduler / cgroup / container chain)
        run: python tests/test_mem_utils.py

      - name: Every test is run by CI or explicitly exempted (coverage guard)
        run: python tests/test_ci_test_coverage.py

      - name: Every test runs on a runner that provides its deps (runner-deps guard)
        run: python tests/test_ci_runner_deps.py

      - name: R classification vector
        run: Rscript tests/test_classification.R

      - name: R provenance-header prepend (finalise_output on.exit guard)
        run: Rscript tests/test_provenance_prepend.R

      - name: R TRC monomer-size label (density panel bp lookup)
        run: Rscript tests/test_trc_monomer_label.R

      - name: R memory-budget resolver (mirrors the Python chain case-for-case)
        run: Rscript tests/test_mem_utils.R

      - name: Pre-commit hook self-test
        run: |
          git config user.email ci@example.com
          git config user.name "ci"
          # Stage a new uncovered runtime-looking file; hook must reject it.
          touch .ci_hook_sentinel.yaml
          git add .ci_hook_sentinel.yaml
          if .githooks/pre-commit; then
            echo "FAIL: pre-commit hook should have rejected an uncovered file" >&2
            exit 1
          fi
          echo "OK: pre-commit hook correctly rejected uncovered file"
          git reset --quiet HEAD .ci_hook_sentinel.yaml
          rm -f .ci_hook_sentinel.yaml

          # Size guard: an oversized blob must be rejected. A 1.4 GB scratch
          # directory once reached the repo this way and needed a history
          # rewrite to remove.
          mkdir -p tmp
          head -c 8000000 /dev/urandom > tmp/.ci_big_sentinel.bin
          git add -f tmp/.ci_big_sentinel.bin
          if .githooks/pre-commit; then
            echo "FAIL: pre-commit hook should have rejected an 8 MB file" >&2
            exit 1
          fi
          echo "OK: pre-commit hook correctly rejected an oversized file"
          git reset --quiet HEAD tmp/.ci_big_sentinel.bin
          rm -f tmp/.ci_big_sentinel.bin

          # ...and must NOT reject an ordinary small change (no false positive).
          echo "# ci probe" >> README.md
          git add README.md
          if .githooks/pre-commit; then
            echo "OK: pre-commit hook allows an ordinary change"
          else
            echo "FAIL: pre-commit hook rejected an ordinary small change" >&2
            exit 1
          fi
          git reset --quiet HEAD README.md
          git checkout -- README.md

      # Backstop for the size guard: the hook only runs for people who set
      # core.hooksPath, and --no-verify bypasses it. This catches an oversized
      # blob that reached the branch anyway.
      - name: No oversized files in the tree
        run: |
          limit=$((5 * 1024 * 1024))
          bad=0
          while IFS= read -r f; do
            case "$f" in tests/fixtures/*) continue;; esac
            sz=$(git cat-file -s ":$f" 2>/dev/null || echo 0)
            if [ "$sz" -gt "$limit" ]; then
              printf '  %8.1f MB  %s\n' "$(echo "$sz" | awk '{print $1/1048576}')" "$f"
              bad=1
            fi
          done <<< "$(git ls-files)"
          if [ "$bad" -ne 0 ]; then
            echo "FAIL: files above 5 MB are tracked (see above)." >&2
            echo "Git blobs are permanent; removing them needs a history rewrite." >&2
            exit 1
          fi
          echo "OK: no tracked file exceeds 5 MB (outside tests/fixtures)"

  # R unit tests that need the bioconductor stack (GenomicRanges) — too heavy for
  # the lightweight `carp-unit` env above, but they are true unit tests (they copy
  # the target functions verbatim and assert on them), so they run here in a
  # dedicated GenomicRanges env rather than only being integration-covered by the
  # full-pipeline fixture jobs. Keep this env minimal (GenomicRanges only): these
  # tests deliberately avoid rtracklayer / the vocabulary so it stays fast.
  # NB: bioconductor-genomicranges on bioconda does NOT pull bioconductor-xvector,
  # yet GenomicRanges lazy-loads XVector at runtime (e.g. range()/revmap ops on
  # CompressedIntegerList), so it is listed explicitly — a missing runtime dep like
  # this is only catchable by running the test, not by the static runner-deps guard.
  unit_r_bioc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: carp-unit-bioc
          create-args: >-
            r-base
            bioconductor-genomicranges
            bioconductor-xvector
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: flexible
          cache-environment: true
          cache-downloads: true

      - name: R tier-1 greedy resolver + te_sat-trim ordering
        run: Rscript tests/test_resolve_tier1_overlaps.R

      - name: R TE-derived TRC summary table (make_unified_annotation)
        run: Rscript tests/test_te_derived_trc_table.R

      # density_track() reproduces tileGenome's whole-genome bin phasing in closed
      # form so it can tile one sequence at a time. Needs only GenomicRanges, so it
      # runs here rather than being deferred to the fixture jobs.
      - name: R per-sequence tile grid == tileGenome (density_utils)
        run: Rscript tests/test_density_tiling.R
